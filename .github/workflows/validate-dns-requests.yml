name: Validate DNS requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate DNS requests
        run: python -m scripts.validate .

  validate-student-request:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator from main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # This checkout is data only. Never execute scripts, tests, or dependencies from candidate/.
      - name: Check out proposed changes as data
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install trusted validator dependency
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Limit student PRs to new DNS requests
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.validate_pr "$PR_BASE_SHA" "$PR_HEAD_SHA" candidate
      - name: Validate proposed DNS requests with trusted code
        run: python -m scripts.validate candidate
