name: Validate DNS requests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate DNS requests
        run: python -m scripts.validate .
      - name: Limit student PRs to new DNS requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.validate_pr "$PR_BASE_SHA" "$PR_HEAD_SHA"
