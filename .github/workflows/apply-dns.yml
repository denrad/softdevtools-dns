name: Apply approved DNS requests

on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'records/*.yaml'

permissions:
  contents: read

concurrency:
  group: cloudflare-dns
  cancel-in-progress: false

jobs:
  apply:
    # Remains off until main is protected and the pilot dry-run has passed.
    if: github.event.pull_request.merged == true && vars.CLOUDFLARE_DNS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the merged, trusted tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Revalidate merged requests
        run: python -m scripts.validate .
      - name: Apply missing CNAMEs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: python -m scripts.apply_dns --apply .
